name: Release

# Publishes ready-to-run emulator builds. The hotel installers download them
# from the latest release, so servers need no .NET.
# Releases are cut by hand once a batch of changes is ready (Actions > Release > Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  # Keep queued merges instead of replacing the previous pending release.
  queue: max
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Installers always take the latest release, so only a passing build is published.
      - name: Test
        run: |
          dotnet build "Plus Emulator.sln" --configuration Release --property:Platform="Any CPU" --maxcpucount:1
          dotnet test Plus.Tests --configuration Release --no-build

      - name: Publish self-contained builds
        run: |
          for rid in linux-x64 linux-arm64 win-x64; do
            dotnet publish "Plus Emulator.csproj" -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "out/$rid"
            mkdir -p "out/$rid/Database"
            cp Database/FreshInstall.sql "out/$rid/Database/"
            cp -r Database/Migrations "out/$rid/Database/"
          done

      - name: Package
        run: |
          mkdir dist
          for rid in linux-x64 linux-arm64; do
            tar -C "out/$rid" --owner=0 --group=0 -czf "dist/plusemu-$rid.tar.gz" .
          done
          (cd out/win-x64 && zip -qr ../../dist/plusemu-win-x64.zip .)
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          # Commit time keeps the tag stable when a failed run is retried another day.
          date=$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y.%m.%d)
          tag="v$date-${commit::7}"
          bash .github/scripts/publish-release.sh "$tag" "PlusEMU $tag" "$commit" dist/*
